<style>
/* ===== Sales (POS) — layout only; colours come from the app theme ===== */
.sales-page{--sl-accent:#2563EB;--sl-tint:#E8F1FF;--sl-track:#DDE5F0}
:root[data-theme="dark"] .sales-page{--sl-accent:#93C5FD;--sl-tint:rgba(59,130,246,.16);--sl-track:rgba(255,255,255,.12)}

/* page head */
.sl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sl-head h1{margin:0 0 6px;font-size:2rem;font-weight:800;letter-spacing:-.02em;color:var(--white)}
.sl-head p{margin:0;color:var(--muted);font-size:.95rem}
.sl-head-actions{display:flex;gap:10px;flex-wrap:wrap}

/* filters */
.sl-filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(190px,1.35fr) auto;gap:14px;align-items:end;padding:16px 18px}
.sl-field{display:flex;flex-direction:column;gap:7px;min-width:0;margin:0}
.sl-field label{margin:0;font-size:.8rem;font-weight:600;color:var(--white)}
.sl-search-box{position:relative;display:flex;align-items:center;min-width:0}
.sl-search-box .ico{position:absolute;left:13px;width:18px;height:18px;color:var(--muted);pointer-events:none}
body.sales-page .sl-search-box input,body.my-sales-page .sl-search-box input{padding-left:40px}
.sl-filter-btns{display:flex;gap:10px;align-items:center}
.sl-filter-btns .btn{justify-content:center}

/* stat cards */
.sl-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:18px}
.sl-stat{display:flex;align-items:center;gap:16px;min-width:0;padding:16px 18px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px}
.sl-ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sb);color:var(--sc)}
.sl-ico .ico{width:28px;height:28px;stroke-width:1.8}
.sl-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl-l{font-size:.8rem;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-v{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;color:var(--white);font-variant-numeric:tabular-nums}
.sl-f{font-size:.72rem;color:var(--muted)}
.s-blue{--sb:#E3F0FF;--sc:#2563EB}
.s-purple{--sb:#F3E8FF;--sc:#8B5CF6}
.s-green{--sb:#E4F9EC;--sc:#16A34A}
.s-red{--sb:#FFE4E6;--sc:#DC2626}
.s-amber{--sb:#FEF3C7;--sc:#D97706}
:root[data-theme="dark"] .s-blue{--sb:rgba(59,130,246,.18);--sc:#93C5FD}
:root[data-theme="dark"] .s-purple{--sb:rgba(168,85,247,.18);--sc:#C4B5FD}
:root[data-theme="dark"] .s-green{--sb:rgba(34,197,94,.18);--sc:#86EFAC}
:root[data-theme="dark"] .s-red{--sb:rgba(239,68,68,.18);--sc:#FCA5A5}
:root[data-theme="dark"] .s-amber{--sb:rgba(245,158,11,.18);--sc:#FCD34D}

/* panels */
.sl-mid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:18px}
.sl-panel{display:flex;flex-direction:column;min-width:0;padding:16px 18px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
:root[data-theme="light"] .sl-stat,:root[data-theme="light"] .sl-panel{border-color:#E6EBF4;box-shadow:0 8px 22px rgba(15,36,80,.05)}
.sl-ph{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.sl-ph .ico{width:20px;height:20px;color:var(--sl-accent)}
.sl-ph h2{margin:0;font-size:1rem;font-weight:700;color:var(--white);white-space:nowrap}
.sl-star .ico{fill:currentColor;stroke:none}

/* payment method donut + legend */
.sl-pay{display:flex;flex:1;align-items:center;gap:26px;flex-wrap:wrap;padding:2px 0 4px;min-height:152px}
.sl-donut{position:relative;display:grid;place-items:center;width:150px;height:150px;border-radius:50%;flex:none}
.sl-donut::before{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--panel)}
.sl-donut span{position:relative;max-width:98px;text-align:center;font-size:.8rem;font-weight:700;line-height:1.3;color:var(--white)}
.sl-donut.empty{background:var(--sl-track)}
.sl-legend{list-style:none;margin:0;padding:0;display:grid;gap:12px;flex:1 1 220px;max-width:460px;min-width:0}
.sl-legend li{display:grid;grid-template-columns:9px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.88rem;color:var(--white)}
.sl-legend i{width:9px;height:9px;border-radius:50%}
.sl-legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-legend b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sl-legend small{font-weight:600;color:var(--muted)}

/* top items */
.sl-tops{list-style:none;margin:0;padding:0}
.sl-tops li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sl-tops li:last-child{border-bottom:0}
.sl-top-n{display:flex;flex-direction:column;min-width:0;font-size:.9rem;font-weight:600;line-height:1.35;color:var(--white)}
.sl-top-n small{font-size:.74rem;font-weight:400;color:var(--muted)}
.sl-tops b{font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}

/* empty states */
.sl-empty{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px;padding:26px 16px;color:var(--muted)}
.sl-eico{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--sl-tint);color:var(--sl-accent)}
.sl-eico .ico{width:26px;height:26px;stroke-width:1.6}
.sl-empty b{display:block;margin-bottom:1px;font-size:.95rem;color:var(--white)}
.sl-empty small{font-size:.8rem}

/* recent sales */
.sl-recent{padding:0;overflow:hidden}
.sl-recent .sl-ph{padding:16px 18px;margin:0}
.sl-recent .table-wrap{border:0;border-top:1px solid var(--line);border-radius:0}
.sl-recent table{min-width:980px}
.sl-recent th:nth-child(1){min-width:170px}
.sl-recent th:nth-child(4){min-width:190px}
.sl-recent th:nth-child(5){min-width:230px}
.sl-recent .dnote{margin:0;padding:12px 18px 16px}
.sl-recent .sl-empty{min-height:150px}

/* responsive */
@media(max-width:1279px){.sl-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1280px) and (max-width:1400px){
  .sl-ico{width:54px;height:54px}
  .sl-ico .ico{width:24px;height:24px}
  .sl-v{font-size:1.15rem}
}
@media(max-width:1200px){
  .sl-filters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sl-filter-btns{grid-column:1/-1;justify-content:flex-end}
}
@media(max-width:760px){
  .sl-head h1{font-size:1.65rem}
  .sl-filters{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}
  .sl-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sl-head-actions{width:100%}
  .sl-head-actions .btn{flex:1;justify-content:center}
}
@media(max-width:560px){
  .sl-filter-btns .btn{flex:1}
  .sl-stats{grid-template-columns:minmax(0,1fr)}
  .sl-stat{padding:14px 16px;gap:14px}
  .sl-ico{width:54px;height:54px}
  .sl-ico .ico{width:24px;height:24px}
  .sl-pay{gap:18px;justify-content:center}
  .sl-donut{width:132px;height:132px}
  .sl-donut::before{inset:21px}
  .sl-legend{flex:1 1 100%}
}
@media(max-width:420px){.sl-filters,.sl-mid{grid-template-columns:minmax(0,1fr)}}
</style>
